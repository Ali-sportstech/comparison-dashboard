async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function checkPw() {
  const pw = document.getElementById('pw').value;
  const hash = await sha256(pw);
  if (hash === "576e7bbe08595735c33f4026c6f24ef0d78f11941729a063b10af5d6502fd157") {
    try { localStorage.setItem('sportsgate_auth', hash); } catch (e) {}
    renderDashboard();
  } else {
    document.getElementById('err').textContent = 'Falsches Passwort.';
  }
}
function renderDashboard() {
  const bytes = Uint8Array.from(atob(DASHBOARD_B64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  document.body.style.margin = '0';
  document.body.innerHTML = '<iframe src="' + url + '" style="border:0;width:100vw;height:100vh;display:block;" title="Dashboard"></iframe>';
}
document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); checkPw(); });
(function() {
  let stored = null;
  try { stored = localStorage.getItem('sportsgate_auth'); } catch (e) {}
  if (stored === "576e7bbe08595735c33f4026c6f24ef0d78f11941729a063b10af5d6502fd157") {
    renderDashboard();
  } else {
    document.getElementById('loading').style.display = 'none';
    const box = document.getElementById('loginBox');
    box.style.display = 'block';
    document.getElementById('pw').focus();
  }
})();
</script>
